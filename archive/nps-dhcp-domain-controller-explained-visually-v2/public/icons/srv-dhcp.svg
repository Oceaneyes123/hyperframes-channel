<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" aria-hidden="true">
  <!-- DHCP service: a wide 2U rack unit whose front shows a pool of unassigned
       address slots. Indigo = infrastructure service (channel semantic). -->
  <rect x="12" y="64" width="216" height="112" rx="14" fill="#78909C"/>
  <rect x="24" y="76" width="192" height="88" rx="8" fill="#37474F"/>
  <g fill="#455A64">
    <rect x="36" y="88" width="44" height="30" rx="5"/>
    <rect x="90" y="88" width="44" height="30" rx="5"/>
    <rect x="144" y="88" width="60" height="30" rx="5"/>
  </g>
  <g fill="#7067E8">
    <rect x="36" y="128" width="44" height="24" rx="5"/>
    <rect x="90" y="128" width="44" height="24" rx="5"/>
    <rect x="144" y="128" width="26" height="24" rx="5"/>
  </g>
  <circle cx="190" cy="140" r="9" fill="#63D69A"/>
  <rect x="12" y="52" width="216" height="12" rx="6" fill="#455A64"/>
</svg>

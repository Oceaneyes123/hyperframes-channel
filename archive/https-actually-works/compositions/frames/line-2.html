const root=document.querySelector('[data-composition-id="line-2"]');
const q=s=>{const el=root.querySelector(s);if(!el)throw new Error(s);return el;};
const M=ChannelMotion,D=8.568163,c={"hello": 1.2, "piece": 2.96, "back": 5.84, "handshake": 7.34};

const e=flash(t);M.routeReveal(q('.pulse'),e.start,e.end);
});
window.__timelines=window.__timelines||{};

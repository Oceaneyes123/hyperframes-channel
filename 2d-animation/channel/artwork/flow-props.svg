<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Original channel artwork. Each symbol is a separately movable 400x400 layer. -->
  <defs>
    <linearGradient id="flow-blue" x2="0.7" y2="1"><stop stop-color="#7BC3FF"/><stop offset="1" stop-color="#2875CF"/></linearGradient>
    <linearGradient id="flow-purple" x2="0.8" y2="1"><stop stop-color="#AEA1FF"/><stop offset="1" stop-color="#6255C9"/></linearGradient>
    <linearGradient id="flow-cyan" x2="0.6" y2="1"><stop stop-color="#91EFF2"/><stop offset="1" stop-color="#2DA4BD"/></linearGradient>
    <linearGradient id="flow-paper" x2="0.5" y2="1"><stop stop-color="#F5F7FF"/><stop offset="1" stop-color="#CAD8F1"/></linearGradient>
  </defs>
  <symbol id="shadow" viewBox="0 0 400 400"><ellipse cx="200" cy="350" rx="145" ry="19" fill="#020819" opacity=".65"/></symbol>

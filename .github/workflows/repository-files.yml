name: Repository file policy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  file-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check-repo-files.py --history HEAD
      - run: python -m unittest discover -s scripts/tests -v

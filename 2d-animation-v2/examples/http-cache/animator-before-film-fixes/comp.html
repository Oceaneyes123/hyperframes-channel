window.__meta={dur:D,fps:30,w:1080,h:1920,cuts:[],inFrame:{'housing-main':[0,D,'whole'],'body-v7-main':[0,D,'whole'],'notch-main':[0,D,'whole']}};

const voice=document.querySelector('#voice'),play=document.querySelector('#play'),restart=document.querySelector('#restart'),slider=document.querySelector('#seek'),clock=document.querySelector('#clock'),status=document.querySelector('#status'),reduced=document.querySelector('#reduced');

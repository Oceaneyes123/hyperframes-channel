<template>
<style>
@import url("channel/styles.css");
#scene-01 .diagram { display:block; width:864px; height:1180px; margin-top:24px; }
#scene-01 .diagram text { font:700 36px Arial,sans-serif; fill:#F5F7FF; text-anchor:middle; }
#scene-01 .wire { stroke:#33415F; stroke-width:10; fill:none; }
#scene-01 .received { opacity:0; }
#scene-01-ground { position:absolute; inset:0; background:#0B1020; }
</style>
<!-- Teaching example. Prefix every id when copying a scene; the host supplies the
     local GSAP runtime and mounts the narration WAV.
     - Hold the scene's measured duration in D and write beats as fractions of it, so
       retiming after TTS never edits hand-written numbers.
     - Reference assets from the project root ("public/icons8/phone.png"), never with
       "../": a frame that escapes the project root fails `hyperframes check`.
     - Keep the full-duration ground clip: a background on #root is gated to the frame's
       window and dark content can land on the host body.
     - Animate opacity, colour and position. Do not tween `scale` on a group that already
       carries a baked `translate() scale()` transform - GSAP drops the baked scale and
       the artwork balloons over the frame. Inline SVG glyph groups always carry one. -->
<div id="scene-01" class="hf-frame" data-composition-id="scene-01" data-width="1080" data-height="1920" data-duration="7">
  <div id="scene-01-ground" class="clip scene-01-ground" data-start="0" data-duration="7" data-track-index="0"></div>
  <div class="hf-safe">
    <h1 class="hf-headline">Same network</h1>
    <svg class="diagram" viewBox="0 0 864 1180" role="img" aria-label="A packet travels through a switch to another computer, then an acknowledgement returns.">
      <defs>
        <g id="scene-01-device">
          <rect x="24" y="42" width="192" height="132" rx="16" fill="#4DA3FF"/>
          <rect x="44" y="62" width="152" height="92" rx="8" fill="#0B1020"/>
          <path d="M72 204h96M120 174v30" stroke="#4DA3FF" stroke-width="14" stroke-linecap="round"/>
        </g>
      </defs>
      <path class="wire" d="M432 285V485 M432 615V855"/>
      <use href="#scene-01-device" x="312" y="0"/>
      <text x="432" y="275">Sender</text>
      <g id="scene-01-switch">
        <rect x="282" y="485" width="300" height="130" rx="16" fill="#7067E8"/>
        <path d="M310 550h44m26 0h44m26 0h44m26 0h34" stroke="#0B1020" stroke-width="22"/>
      </g>
      <text x="660" y="563">Switch</text>
      <use href="#scene-01-device" x="312" y="810"/>
      <text x="432" y="1075">Receiver</text>
      <g id="scene-01-result" class="received">
        <path d="M380 915l36 36 70-76" fill="none" stroke="#63D69A" stroke-width="14"/>
      </g>
      <circle id="scene-01-packet" cx="432" cy="315" r="22" fill="#4DA3FF"/>
      <circle id="scene-01-answer" class="received" cx="490" cy="825" r="18" fill="#63D69A"/>
    </svg>
  </div>
</div>
<script>
{
  const scene = document.querySelector('[data-composition-id="scene-01"]');
  const D = 7;                        // replace with this scene's measured WAV duration
  const t = (f) => f * D;             // every beat is a fraction of the measured scene
  const tl = gsap.timeline({paused:true});
  tl.fromTo(scene.querySelector('#scene-01-packet'), {y:0}, {y:150, duration:t(.21), ease:'none'}, t(.09))
    // emphasis is a colour/opacity change, never a scale tween on a baked transform
    .fromTo(scene.querySelector('#scene-01-switch'), {opacity:1}, {opacity:.6, duration:t(.06)}, t(.30))
    .to(scene.querySelector('#scene-01-switch'), {opacity:1, duration:t(.06)}, t(.36))
    .to(scene.querySelector('#scene-01-packet'), {y:510, duration:t(.26), ease:'none'}, t(.36))
    .to(scene.querySelector('#scene-01-packet'), {opacity:0, duration:t(.03)}, t(.61))
    .to(scene.querySelector('#scene-01-result'), {opacity:1, duration:t(.04)}, t(.61))
    .to(scene.querySelector('#scene-01-answer'), {opacity:1, duration:t(.03)}, t(.67))
    .to(scene.querySelector('#scene-01-answer'), {y:-510, duration:t(.24), ease:'none'}, t(.70));
  window.__timelines = window.__timelines || {};
  window.__timelines['scene-01'] = tl;
}
</script>
</template>

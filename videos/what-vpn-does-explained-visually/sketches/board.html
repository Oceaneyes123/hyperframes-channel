<!doctype html>
<html lang="en">
<meta charset="utf-8">

<title>What Happens When You Turn on a VPN? — storyboard sketches</title>
<style>
  :root{color-scheme:dark;--bg:#0B1020;--surface:#141D35;--ink:#F5F7FF;--muted:#AAB5CC;--rule:#33415F;--client:#4DA3FF;--infra:#7067E8;--green:#63D69A;--amber:#F5B94D;--external:#4DD9E8;--red:#F06A5F}
  *{box-sizing:border-box}body{margin:0;background:#070B15;color:var(--ink);font:600 15px/1.3 system-ui,sans-serif}
  header{max-width:1100px;margin:auto;padding:24px 16px;color:var(--muted)}header h1{margin:0 0 6px;color:var(--ink);font-size:22px}header p{margin:0}
  main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100vw),360px));justify-content:center;gap:20px;padding:0 10px 32px}
  .frame{position:relative;isolation:isolate;width:min(360px,100vw);height:640px;overflow:hidden;background:var(--bg);border:1px solid #273350;border-radius:12px}
  .frame:before{content:"";position:absolute;z-index:-2;inset:-8%;background:radial-gradient(ellipse at 76% 36%,#202b513b,transparent 48%),radial-gradient(ellipse at 20% 77%,#142b463b,transparent 40%)}
  .frame:after{content:"";position:absolute;z-index:-1;inset:0;opacity:.16;background-image:linear-gradient(#33415f55 1px,transparent 1px),linear-gradient(90deg,#33415f55 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(transparent,black 20%,black 85%,transparent)}
  .head{position:absolute;left:24px;right:24px;top:60px}.eyebrow{font:700 10px/1.2 ui-monospace,monospace;letter-spacing:.14em;color:var(--external);text-transform:uppercase}.headline{margin-top:9px;font-size:25px;line-height:1.05;letter-spacing:-.035em;max-width:310px}.foot{position:absolute;bottom:16px;left:20px;right:20px;display:flex;justify-content:space-between;color:var(--muted);font:600 9px ui-monospace,monospace;letter-spacing:.06em}
  svg.routes{position:absolute;inset:0;width:100%;height:100%;z-index:0;overflow:visible}.routes path{fill:none;stroke:var(--infra);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.routes path.direct{stroke:var(--external)}.routes path.closed{stroke:var(--red);stroke-dasharray:7 8}.routes path.faint{stroke:#64718e;stroke-width:3;stroke-dasharray:5 9;marker-end:none}.routes path.https{stroke:var(--green);stroke-width:3;stroke-dasharray:5 6}
  .node{position:absolute;z-index:1;transform:translate(-50%,-50%);width:104px;text-align:center}.node img{display:block;width:84px;height:84px;object-fit:contain;margin:0 auto 5px;filter:drop-shadow(0 8px 14px #0008)}.node .tag{display:inline-block;padding:4px 7px;border:1px solid var(--rule);border-radius:5px;background:#0B1020e8;color:var(--ink);font:700 10px/1.1 ui-monospace,monospace;letter-spacing:.04em;white-space:nowrap}.node.device .tag{border-color:#4DA3FF88}.node.server .tag{border-color:#7067E899}.node.site .tag{border-color:#4DD9E888}.node.warn .tag{border-color:#F06A5F99}.node.soft img{filter:grayscale(1) opacity(.55)}
  .pill{position:absolute;z-index:2;transform:translate(-50%,-50%);padding:6px 8px;border:1px solid var(--infra);border-radius:6px;background:#171c34;color:var(--ink);font:700 9px/1 ui-monospace,monospace;white-space:nowrap;box-shadow:0 0 18px #7067e833}.pill.amber{border-color:var(--amber);color:var(--amber)}.pill.green{border-color:var(--green);color:var(--green)}.pill.red{border-color:var(--red);color:var(--red)}
  .packet{position:absolute;z-index:2;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;padding:5px 7px;background:#141D35;border:2px solid var(--client);border-radius:5px;color:var(--ink);font:700 8px/1 ui-monospace,monospace;white-space:nowrap}.packet:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--client)}.packet.secure{border-color:var(--red)}.packet.secure:before{background:var(--red)}.packet.reply{border-color:var(--green)}.packet.reply:before{background:var(--green)}
  .note{position:absolute;z-index:2;left:24px;right:24px;bottom:54px;text-align:center;color:var(--muted);font:700 10px ui-monospace,monospace;letter-spacing:.05em}.key{display:flex;gap:12px;flex-wrap:wrap;padding:0 16px 24px;justify-content:center;color:var(--muted);font:11px ui-monospace,monospace}.key i{display:inline-block;width:10px;height:3px;margin:0 5px 2px 0;background:var(--client)}.key .vpn{background:var(--infra)}.key .https{background:var(--green)}.key .warn{background:var(--red)}
  @media(max-width:380px){main{padding:0;gap:12px}.frame{border-radius:0;border-left:0;border-right:0}}
</style>

];
const root=document.querySelector('#board');
for(const s of scenes){
  const frame=document.createElement('section');frame.className='frame';frame.id=`frame-${s.n}`;
  frame.innerHTML=`<div class="head"><div class="eyebrow">${s.sub}</div><div class="headline">${s.title}</div></div><svg class="routes" viewBox="0 0 360 640" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#AAB5CC"/></marker></defs>${(s.paths||[]).map(([d,k])=>`<path class="${k||''}" d="${d}"/>`).join('')}</svg>`;
